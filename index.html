<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كابوس التللر - النسخة الكارتونية المتكاملة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: #0d1117;
            overflow: hidden;
        }

        .bank-hall-view {
            background: linear-gradient(180deg, #dbeafe 0%, #93c5fd 40%, #60a5fa 100%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
        }

        .counter-wood-shelf {
            background: linear-gradient(0deg, #2a1508 0%, #4a2810 40%, #78350f 100%);
            border-top: 6px solid #b45309;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.7);
        }

        .terminal-panel {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 3px solid #334155;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }

        .uv-mode-active {
            box-shadow: 0 0 50px #c084fc, inset 0 0 30px #a855f7 !important;
            background-color: rgba(88, 28, 135, 0.9) !important;
        }

        .money-btn {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #15803d;
        }
        .money-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #15803d;
        }
    </style>
</head>
<body class="text-white flex flex-col justify-between h-screen w-screen p-1.5">

    <!-- Header Actions -->
    <header class="flex justify-between items-center px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl shrink-0 z-30">
        <button onclick="undoAction()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
            <i class="fa-solid fa-rotate-left text-amber-400"></i> تراجع
        </button>
        <div class="flex items-center gap-4 text-xs font-bold">
            <span>الهدف: <b class="text-emerald-400" id="target-display">2500</b> ج.م</span>
            <span>الفعلي: <b class="text-amber-400" id="actual-display">0</b> ج.م</span>
        </div>
        <button onclick="confirmTransaction()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 px-4 py-1.5 rounded-lg text-xs font-black shadow-lg flex items-center gap-1.5">
            <i class="fa-solid fa-check-circle"></i> تأكيد المعاملة (CONFIRM)
        </button>
    </header>

    <!-- Main Game Window -->
    <main id="game-container" class="relative flex-1 flex flex-col max-w-5xl w-full mx-auto rounded-2xl border-2 border-slate-800 shadow-2xl overflow-hidden justify-between p-2 my-1 bg-slate-950">
        
        <!-- Start Overlay -->
        <div id="start-screen" class="absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6 text-center">
            <div class="w-20 h-20 bg-amber-500 text-slate-950 rounded-full flex items-center justify-center text-4xl mb-4 shadow-xl animate-bounce">
                <i class="fa-solid fa-user-tie"></i>
            </div>
            <h1 class="text-3xl font-black text-amber-400 mb-2">كابوس التللر 2D</h1>
            <p class="text-slate-300 text-xs sm:text-sm max-w-md mb-6 leading-relaxed">
                استعد لخدمة العملاء على شباك التللر الرئيسي!
            </p>
            <button onclick="startGame()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xl font-black px-10 py-3.5 rounded-xl shadow-xl transition">
                🚀 ابدأ الشفت الآن
            </button>
        </div>

        <!-- Bank Hall View -->
        <div class="relative h-48 sm:h-56 bank-hall-view rounded-xl border-2 border-slate-700 overflow-hidden flex flex-col justify-between p-3 text-slate-900 shadow-inner">
            
            <div class="relative z-10 flex justify-between items-center text-[11px] font-black text-slate-800">
                <span class="bg-white/80 px-2 py-0.5 rounded border border-slate-300 shadow-sm">فرع البنك الأهلي المصري</span>
                <span class="bg-white/80 px-2 py-0.5 rounded border border-slate-300 shadow-sm">شباك رقم 4</span>
            </div>

            <!-- Customer Full Body Vector Sprite -->
            <div class="relative z-10 flex flex-col items-center justify-center my-auto">
                <div id="speech-bubble" class="bg-white text-slate-950 px-3 py-1.5 rounded-xl shadow-xl border-2 border-amber-400 text-xs font-black max-w-xs text-center mb-2">
                    يا بني خلصني ورايا مصلحة!
                </div>

                <!-- Custom 2D Chibi Character Render -->
                <div id="customer-sprite" class="w-32 h-32 sm:w-36 sm:h-36 flex items-center justify-center transition-all">
                    <!-- Dynamic SVG Sprite -->
                </div>

                <div class="w-36 bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-700 mt-1">
                    <div id="patience-bar" class="bg-emerald-500 h-full w-full"></div>
                </div>
            </div>

            <!-- Glass Reflection Grid -->
            <div class="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:12px_12px]"></div>
        </div>

        <!-- Desk Workspace (Terminal + Cash Drawer) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
            
            <!-- Left: Terminal -->
            <div class="terminal-panel p-3 rounded-xl flex flex-col justify-between">
                <div class="flex justify-between items-center mb-1.5 border-b border-slate-700 pb-1">
                    <span class="text-xs font-bold text-slate-400 flex items-center gap-1">
                        <i class="fa-solid fa-desktop text-cyan-400"></i> حاسبة التللر
                    </span>
                    <span id="trans-badge" class="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded font-bold">سحب نقدي</span>
                </div>

                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-left mb-2">
                    <div id="cust-info" class="text-xs text-amber-300 font-bold">عم الحاج المستعجل</div>
                    <div id="calc-screen" class="text-2xl font-black text-emerald-400">500 ج.م</div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="toggleUV()" id="uv-btn" class="bg-purple-900/80 hover:bg-purple-800 border border-purple-600 text-purple-200 py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1">
                        <i class="fa-solid fa-lightbulb"></i> كاشف UV
                    </button>
                    <button onclick="speedUp()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1">
                        <i class="fa-solid fa-forward"></i> تسليك
                    </button>
                </div>
            </div>

            <!-- Right: Drawer & Stamps -->
            <div class="counter-wood-shelf p-3 rounded-xl flex flex-col justify-between">
                <div class="flex justify-between items-center text-xs mb-1.5 border-b border-amber-900/60 pb-1">
                    <span class="text-amber-200/80 font-bold">المبلغ في الدرج:</span>
                    <span class="text-emerald-400 font-black text-sm"><span id="prepared-amount">0</span> ج.م</span>
                </div>

                <div class="grid grid-cols-4 gap-1.5 mb-2">
                    <button onclick="addMoney(200)" class="money-btn bg-emerald-700 hover:bg-emerald-600 border border-emerald-500 p-2 rounded-lg text-center font-black text-white text-sm">200</button>
                    <button onclick="addMoney(100)" class="money-btn bg-teal-700 hover:bg-teal-600 border border-teal-500 p-2 rounded-lg text-center font-black text-white text-sm">100</button>
                    <button onclick="addMoney(50)" class="money-btn bg-amber-700 hover:bg-amber-600 border border-amber-500 p-2 rounded-lg text-center font-black text-white text-sm">50</button>
                    <button onclick="addMoney(20)" class="money-btn bg-blue-700 hover:bg-blue-600 border border-blue-500 p-2 rounded-lg text-center font-black text-white text-sm">20</button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="clearMoney()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded-lg text-xs font-bold border border-slate-700">تصفير 🔄</button>
                    <button onclick="rejectTransaction()" class="bg-rose-700 hover:bg-rose-600 text-white py-1.5 rounded-lg text-xs font-bold shadow">رفض / تزوير ❌</button>
                </div>
            </div>

        </div>

    </main>

    <!-- Logic Engine -->
    <script>
        class SFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            play(type) {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                if(type === 'stamp') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);
                } else if(type === 'cash') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                } else {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                }
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
        }
        const sfx = new SFX();

        const CUSTOMERS = [
            {
                name: 'عم الحاج المستعجل', type: 'سحب نقدي', amount: 500, isFake: false,
                dialogue: 'خلصني يا بني ورايا مصلحة مستعجلة!',
                svg: `<svg viewBox="0 0 100 120" class="w-full h-full">
                    <rect x="30" y="70" width="40" height="45" fill="#1e3a8a" rx="6"/>
                    <circle cx="50" cy="45" r="24" fill="#e0a96d"/>
                    <path d="M 25 35 Q 50 15 75 35 L 75 42 L 25 42 Z" fill="#ffffff"/>
                    <rect x="25" y="40" width="50" height="4" fill="#dc2626"/>
                    <circle cx="42" cy="45" r="3" fill="#000"/><circle cx="58" cy="45" r="3" fill="#000"/>
                    <path d="M 40 58 Q 50 50 60 58" stroke="#000" stroke-width="2.5" fill="none"/>
                </svg>`
            },
            {
                name: 'الأستاذ عثمان السوداني', type: 'تجديد إقامة', amount: 1750, isFake: false,
                dialogue: 'داير أجدد الإقامة لي ولعيالي الستة يا زول!',
                svg: `<svg viewBox="0 0 100 120" class="w-full h-full">
                    <rect x="28" y="68" width="44" height="48" fill="#15803d" rx="6"/>
                    <circle cx="50" cy="45" r="24" fill="#8d5b4c"/>
                    <path d="M 20 32 Q 50 12 80 32 L 80 42 L 20 42 Z" fill="#ffffff"/>
                    <circle cx="42" cy="45" r="3" fill="#000"/><circle cx="58" cy="45" r="3" fill="#000"/>
                    <path d="M 42 58 Q 50 64 58 58" stroke="#000" stroke-width="2.5" fill="none"/>
                </svg>`
            },
            {
                name: 'البرنس توفيق (نصاب)', type: 'ويسترن يونيون', amount: 3000, isFake: true,
                dialogue: 'تحويل دولار براني.. اختم من غير رغي!',
                svg: `<svg viewBox="0 0 100 120" class="w-full h-full">
                    <rect x="28" y="68" width="44" height="48" fill="#18181b" rx="6"/>
                    <circle cx="50" cy="45" r="24" fill="#d19c65"/>
                    <path d="M 22 30 Q 50 16 78 30 L 82 36 L 18 36 Z" fill="#09090b"/>
                    <rect x="34" y="40" width="32" height="8" rx="2" fill="#000"/>
                    <path d="M 42 58 Q 50 52 58 58" stroke="#000" stroke-width="2.5" fill="none"/>
                </svg>`
            }
        ];

        let targetBalance = 2500, actualBalance = 0, preparedMoney = 0;
        let currentCust = null, uvActive = false, patience = 100, timer = null;

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            initCustomer();
        }

        function initCustomer() {
            preparedMoney = 0;
            document.getElementById('prepared-amount').innerText = preparedMoney;
            currentCust = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
            
            document.getElementById('speech-bubble').innerText = currentCust.dialogue;
            document.getElementById('customer-sprite').innerHTML = currentCust.svg;
            document.getElementById('cust-info').innerText = currentCust.name;
            document.getElementById('calc-screen').innerText = `${currentCust.amount} ج.م`;
            document.getElementById('trans-badge').innerText = currentCust.type;
            patience = 100;

            if(timer) clearInterval(timer);
            timer = setInterval(() => {
                patience -= 1.3;
                document.getElementById('patience-bar').style.width = `${Math.max(0, patience)}%`;
                if(patience <= 0) {
                    sfx.play('error');
                    nextCustomer();
                }
            }, 150);
        }

        function addMoney(amt) {
            sfx.play('cash');
            preparedMoney += amt;
            document.getElementById('prepared-amount').innerText = preparedMoney;
        }

        function clearMoney() {
            preparedMoney = 0;
            document.getElementById('prepared-amount').innerText = preparedMoney;
        }

        function toggleUV() {
            sfx.play('cash');
            uvActive = !uvActive;
            const container = document.getElementById('game-container');
            if(uvActive) {
                container.classList.add('uv-mode-active');
                document.getElementById('speech-bubble').innerText = currentCust.isFake ? '🔍 (علامات تزوير واضحة!)' : '🔍 (الأوراق سليمة 100%)';
            } else {
                container.classList.remove('uv-mode-active');
                document.getElementById('speech-bubble').innerText = currentCust.dialogue;
            }
        }

        function speedUp() {
            sfx.play('cash');
            patience = Math.min(100, patience + 30);
        }

        function confirmTransaction() {
            sfx.play('stamp');
            if(currentCust.isFake) {
                sfx.play('error');
                alert('🚨 قبلت أوراق مزورة والتفتيش خصم منك!');
            } else if(preparedMoney === currentCust.amount || currentCust.type === 'تجديد إقامة') {
                actualBalance += currentCust.amount;
                document.getElementById('actual-display').innerText = actualBalance;
            } else {
                sfx.play('error');
                alert('⚠️ خطأ في المبلغ!');
            }
            nextCustomer();
        }

        function rejectTransaction() {
            sfx.play('stamp');
            if(currentCust.isFake) {
                alert('🛡️ بطل! كشفت التزوير بنجاح.');
            } else {
                sfx.play('error');
                alert('❌ ظلمت عميل أوراقه سليمة!');
            }
            nextCustomer();
        }

        function undoAction() {
            preparedMoney = 0;
            document.getElementById('prepared-amount').innerText = 0;
        }

        function nextCustomer() {
            if(timer) clearInterval(timer);
            initCustomer();
        }
    </script>
</body>
</html>
